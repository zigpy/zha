[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<3"]
build-backend = "setuptools.build_meta"

[project]
name = "zha"
dynamic = ["version"]
description = "Library implementing ZHA for Home Assistant"
urls = {repository = "https://github.com/zigpy/zha"}
authors = [
    {name = "David F. Mulcahey", email = "david.mulcahey@icloud.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "zigpy==1.6.0",
    "bellows==0.49.2",
    "zigpy-znp==1.1.0",
    "zigpy-deconz==0.25.5",
    "zigpy-xbee==0.21.1",
    "zigpy-zigate==0.14.0",
    "zha-quirks==1.2.0",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[project.optional-dependencies]
testing = [
    "pytest",
    "coloredlogs",
    "python-slugify"
]

[dependency-groups]
testing = [
    "codespell==2.4.2",
    "coloredlogs",
    "colorlog",
    "coverage[toml]",
    "freezegun",
    "looptime>=0.7",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pytest",
    "pytest-asyncio<1.0",
    "pytest-cov",
    "pytest-sugar",
    "pytest-timeout",
    "python-slugify",
    "ruff==0.15.16",
    "uv>=0.11.16",
]
ci = [
    {include-group = "testing"},
    "pytest-github-actions-annotate-failures",
    "pytest-xdist",
]

[tool.uv]
default-groups = ["testing"]

[tool.setuptools-git-versioning]
enabled = true

[tool.codespell]
skip = ["tests/data/devices/*"]
ignore-words-list = "hass, checkin"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
show_error_context = true
error_summary = true

install_types = true
non_interactive = true

# Per-module error-code suppressions below are regenerated by
# `python -m tools.regenerate_mypy_ignores`. They are sorted easiest-to-fix
# first; clean up a module's errors and re-run the tool to shrink the list.
