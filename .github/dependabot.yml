version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      # The Zigbee radio stack and zha-quirks skip the cooldown (updated immediately).
      exclude:
        - "zigpy*"
        - "bellows"
        - "zha-quirks"
    groups:
      python-dependencies:
        patterns:
          - "*"
        # The Zigbee radio stack and zha-quirks stay as individual PRs.
        exclude-patterns:
          - "zigpy*"
          - "bellows"
          - "zha-quirks"
          # Build requirements aren't in uv.lock, so Dependabot has no previous
          # version for them. A grouped change that mixes one of those with
          # lock-only bumps is dropped entirely ("Previous version was not
          # provided for ..."), so they get their own PRs instead.
          - "setuptools-git-versioning"
          - "wheel"
    ignore:
      # Dependabot sees `setuptools` as the build requirement and as a
      # transitive uv.lock entry, can't update either, and fails the whole
      # job with "No files have changed!" (dependabot/dependabot-core#14118).
      - dependency-name: "setuptools"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
